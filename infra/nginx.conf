events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # --- DEV SERVER on :80 (no HTTPS redirect) ---
  server {
    listen 80;
    server_name localhost;

    # --- Single Page App frontend ---
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # --- API proxy with CORS + preflight ---
    location /api/ {
      # CORS headers for real + preflight responses
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

      # --- Handle preflight ---
      if ($request_method = OPTIONS) {
        return 204;
      }

      client_max_body_size 200M;

      # Fix the missing /api/ in backend path
      proxy_pass http://backend:8000$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSockets ---
    location /ws/ {
      proxy_pass http://backend:8000/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
    }
  }
}
